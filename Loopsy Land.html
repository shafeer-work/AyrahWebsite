<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loopsy Land</title>
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fff6e3;--ink:#3b2a4f;--soft:#6b5a80;--card:#ffffff;--chip:#ffe0f0;--shadow:rgba(80,40,120,.18);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#20152e;--ink:#fff1de;--soft:#c9b8e0;--card:#33244a;--chip:#4a2f63;--shadow:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#20152e;--ink:#fff1de;--soft:#c9b8e0;--card:#33244a;--chip:#4a2f63;--shadow:rgba(0,0,0,.5)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;overflow-x:hidden;min-height:100vh}
#yarn{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.ball{position:absolute;border-radius:50%;opacity:.55;background:
  repeating-linear-gradient(35deg,rgba(255,255,255,.45) 0 4px,transparent 4px 9px),
  radial-gradient(circle at 30% 30%,rgba(255,255,255,.7),var(--c) 60%);
  animation:float var(--d) ease-in-out infinite alternate;transition:transform .4s ease-out}
@keyframes float{from{margin-top:0;rotate:0deg}to{margin-top:-60px;rotate:200deg}}
#abs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;width:var(--s);height:var(--s);left:var(--x);top:var(--y);background:linear-gradient(135deg,var(--a),var(--b));filter:blur(45px);opacity:.42;animation:morph var(--d) ease-in-out infinite,drift calc(var(--d)*1.6) ease-in-out infinite alternate}
@keyframes morph{0%,100%{border-radius:60% 40% 30% 70%/60% 30% 70% 40%}50%{border-radius:30% 60% 70% 40%/50% 60% 30% 60%}}
@keyframes drift{to{transform:translate(90px,-70px) scale(1.25) rotate(90deg)}}
.ring{position:absolute;border-radius:50%;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border:6px dashed var(--a);opacity:.35;animation:spin var(--d) linear infinite}
.cone{border:0;opacity:.4;background:conic-gradient(#ff8fc4,#ffd93b,#6fd16b,#5cc3f5,#b28dff,#ff8fc4);-webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%)}
@keyframes spin{to{transform:rotate(360deg)}}
.shape{position:absolute;left:var(--x);top:var(--y);opacity:.5;animation:tumble var(--d) ease-in-out infinite alternate}
@keyframes tumble{from{transform:translateY(0) rotate(0)}to{transform:translateY(-100px) rotate(260deg)}}
.sq{width:var(--s);height:var(--s);border-radius:20%;background:var(--a)}
.tri{width:0;height:0;border-left:calc(var(--s)/2) solid transparent;border-right:calc(var(--s)/2) solid transparent;border-bottom:var(--s) solid var(--a)}
.sw{position:absolute;left:var(--x);top:var(--y);color:var(--a);animation:sway var(--d) ease-in-out infinite alternate}
.sw svg{width:280px;height:40px;stroke:currentColor;fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:14 12;opacity:.5;animation:dash 3s linear infinite}
@keyframes dash{to{stroke-dashoffset:-260}}
@keyframes sway{from{transform:translateX(-40px) rotate(-8deg)}to{transform:translateX(60px) rotate(10deg)}}
main,header,footer{position:relative;z-index:1}
header{text-align:center;padding:48px 20px 12px}
h1{font-size:clamp(2.2rem,8vw,4.5rem);margin:0;line-height:1.05}
h1 span{display:inline-block;animation:bob 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.12s)}
h1 span:hover{transform:scale(1.4) rotate(-12deg);transition:transform .2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.sub{color:var(--soft);font-size:1.15rem;margin:10px auto 0;max-width:34rem}
.thread{display:block;margin:10px auto 0;width:min(420px,80%);height:30px}
.thread path{stroke:#ff5fa2;stroke-width:5;fill:none;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600;animation:draw 2.5s .3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:18px 16px}
.chip{border:0;background:var(--chip);color:var(--ink);font:inherit;font-weight:700;padding:10px 20px;border-radius:999px;cursor:pointer;transition:transform .2s,background .2s,box-shadow .2s}
.chip:hover{transform:translateY(-4px) rotate(-3deg);box-shadow:0 8px 16px var(--shadow)}
.chip.on{background:#ff5fa2;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:26px;max-width:1100px;margin:0 auto;padding:12px 20px 110px}
.card{perspective:900px;height:260px;opacity:0;transform:translateY(30px) scale(.9);transition:opacity .6s,transform .6s}
.card.in{opacity:1;transform:none}
.card.hide{display:none}
.tilt{width:100%;height:100%;transform-style:preserve-3d;transition:transform .15s ease-out;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
.card:hover .inner{transform:rotateY(180deg) scale(1.05)}
.face{position:absolute;inset:0;border-radius:26px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;box-shadow:0 14px 28px var(--shadow)}
.front{background:linear-gradient(145deg,var(--c),var(--c2));color:#3b2a4f}
.front .em{font-size:5.2rem;filter:drop-shadow(0 6px 4px rgba(0,0,0,.18));animation:bob 3s ease-in-out infinite}
.front b{font-size:1.25rem;margin-top:6px}
.tag{position:absolute;top:12px;left:14px;background:rgba(255,255,255,.75);border-radius:999px;padding:2px 12px;font-size:.8rem;font-weight:700}
.back{background:var(--card);transform:rotateY(180deg);border:4px dashed var(--c2)}
.back p{margin:6px 0 12px;color:var(--soft)}
.btn{display:inline-block;background:#25d366;color:#fff;text-decoration:none;border:0;font:inherit;font-weight:700;padding:10px 20px;border-radius:999px;cursor:pointer;transition:transform .2s}
.btn:hover{transform:scale(1.08) rotate(-2deg)}
.btn.alt{background:#ff5fa2}
.wa{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:5;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.6)}100%{box-shadow:0 0 0 22px rgba(37,211,102,0)}}
footer{text-align:center;color:var(--soft);padding:0 20px 90px}
#modal{position:fixed;inset:0;z-index:10;background:rgba(30,10,50,.6);display:none;align-items:center;justify-content:center;padding:20px}
#modal.open{display:flex}
.sheet{background:var(--card);border-radius:32px;max-width:420px;width:100%;padding:30px;text-align:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1);position:relative}
@keyframes pop{from{transform:scale(.3) rotate(-10deg);opacity:0}}
.big{width:200px;height:200px;margin:0 auto 10px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7rem;animation:bob 2s ease-in-out infinite}
.sheet h2{margin:0}.sheet p{color:var(--soft)}
.x{position:absolute;top:12px;right:16px;border:0;background:none;font-size:1.8rem;color:var(--ink);cursor:pointer;transition:transform .3s}
.x:hover{transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="abs" aria-hidden="true"></div>
<div id="yarn" aria-hidden="true"></div>
<header>
  <h1 id="title" aria-label="Loopsy Land"></h1>
  <svg class="thread" viewBox="0 0 420 30" aria-hidden="true"><path d="M5 15 Q35 -5 65 15 T125 15 T185 15 T245 15 T305 15 T365 15 T415 15"/></svg>
  <p class="sub"><b>Handmade crochet toys, accessories &amp; decor</b> · Every loop is a little bit of magic. 🧶</p>
</header>
<main>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</main>
<footer>Every piece is one of a kind. Hover (or tap) a card to peek inside!</footer>
<a class="btn wa" id="waFloat" target="_blank" rel="noopener">💬 Order on WhatsApp</a>

<div id="modal" role="dialog" aria-modal="true" aria-label="Item details">
  <div class="sheet">
    <button class="x" id="close" aria-label="Close">×</button>
    <div class="big" id="mBig"></div>
    <h2 id="mName"></h2>
    <p id="mDesc"></p>
    <a class="btn" id="mWa" target="_blank" rel="noopener">💬 Ask about this</a>
  </div>
</div>

<script>
// ✏️ EDIT THESE: your WhatsApp number (country code, digits only) and items.
// To use a real photo, add  img:"data-or-url"  to an item (shown instead of the emoji).
var WA_NUMBER = "919895268827";
var ITEMS = [
  {n:"Bunny Buddy",cat:"Toys",e:"🐰",c:"#ffd1e8",c2:"#ff8fc4",d:"A soft amigurumi bunny, perfect for cuddles."},
  {n:"Octo Pal",cat:"Toys",e:"🐙",c:"#ffe7a8",c2:"#ffb347",d:"A friendly octopus with eight wiggly arms."},
  {n:"Teddy Bear",cat:"Toys",e:"🧸",c:"#ffd9b8",c2:"#e8a06a",d:"A classic little bear with a big heart."},
  {n:"Dino Roar",cat:"Toys",e:"🦖",c:"#c9f2c7",c2:"#6fd16b",d:"A green dino that is not scary at all!"},
  {n:"Rainbow Scrunchie",cat:"Accessories",e:"🎀",c:"#e5d4ff",c2:"#b28dff",d:"Colorful hair scrunchies in every shade."},
  {n:"Cozy Beanie",cat:"Accessories",e:"🧢",c:"#bfe9ff",c2:"#5cc3f5",d:"A warm, stretchy beanie for chilly days."},
  {n:"Mini Bag",cat:"Accessories",e:"👜",c:"#ffd1d1",c2:"#ff7f7f",d:"A tiny crochet bag for treasures and snacks."},
  {n:"Cute Keychain",cat:"Accessories",e:"🔑",c:"#fff3a6",c2:"#ffd93b",d:"Little charms to hang on bags and keys."},
  {n:"Flower Bouquet",cat:"Decor",e:"💐",c:"#ffd1e8",c2:"#ff6fb0",d:"Flowers that never wilt, made of soft yarn."},
  {n:"Tea Coasters",cat:"Decor",e:"☕",c:"#d7f5e4",c2:"#7ddba8",d:"Round coasters in happy colors."},
  {n:"Rainbow Hanging",cat:"Decor",e:"🌈",c:"#c9e0ff",c2:"#7aa8ff",d:"A wall hanging to brighten any room."},
  {n:"Cactus Pot",cat:"Decor",e:"🌵",c:"#d8f5b5",c2:"#9bd94a",d:"A prickle-free cactus in a tiny pot."}
];
var $ = function(s){return document.querySelector(s)};
function waLink(t){return "https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(t)}
$("#waFloat").href = waLink("Hi! I saw your crochet collection and would like to order.");

// Wiggly title
var t = "Loopsy Land", h = "", k = 0;
for (var i=0;i<t.length;i++){ h += t[i]===" " ? " " : '<span style="--i:'+(k++)+';color:hsl('+(k*37%360)+',80%,58%)">'+t[i]+'</span>'; }
$("#title").innerHTML = h;

// Floating yarn balls with mouse parallax
var cols=["#ff8fc4","#ffb347","#6fd16b","#5cc3f5","#b28dff","#ffd93b"], balls=[];
for (var b=0;b<12;b++){
  var el=document.createElement("div"); el.className="ball";
  var s=50+Math.random()*80;
  el.style.cssText="width:"+s+"px;height:"+s+"px;left:"+Math.random()*95+"%;top:"+Math.random()*90+"%;--c:"+cols[b%6]+";--d:"+(5+Math.random()*6)+"s;animation-delay:-"+Math.random()*6+"s";
  el.dataset.depth=(.2+Math.random()*.8).toFixed(2);
  $("#yarn").appendChild(el); balls.push(el);
}
document.addEventListener("mousemove",function(e){
  var x=e.clientX/innerWidth-.5, y=e.clientY/innerHeight-.5;
  balls.forEach(function(el){var d=el.dataset.depth*60;el.style.transform="translate("+(-x*d)+"px,"+(-y*d)+"px)"});
});

// Abstract background layer: morphing blobs, rings, shapes, squiggles
var A=$("#abs");
function rn(a,b){return a+Math.random()*(b-a)}
function mk(cls,css,html){var e=document.createElement("div");e.className=cls;e.style.cssText=css;if(html)e.innerHTML=html;A.appendChild(e)}
for(var q=0;q<5;q++) mk("blob","--s:"+rn(260,420)+"px;--x:"+rn(-5,80)+"%;--y:"+rn(-5,75)+"%;--a:"+cols[q%6]+";--b:"+cols[(q+2)%6]+";--d:"+rn(7,12)+"s");
for(var q=0;q<4;q++) mk("ring"+(q%2?" cone":""),"--s:"+rn(120,260)+"px;--x:"+rn(0,85)+"%;--y:"+rn(0,80)+"%;--a:"+cols[q%6]+";--d:"+rn(14,28)+"s");
for(var q=0;q<10;q++) mk("shape "+(q%2?"sq":"tri"),"--s:"+rn(24,50)+"px;--x:"+rn(0,95)+"%;--y:"+rn(10,95)+"%;--a:"+cols[q%6]+";--d:"+rn(6,13)+"s;animation-delay:-"+rn(0,6)+"s");
for(var q=0;q<4;q++) mk("sw","--x:"+rn(0,70)+"%;--y:"+rn(5,90)+"%;--a:"+cols[(q+1)%6]+";--d:"+rn(6,10)+"s",'<svg viewBox="0 0 280 40"><path d="M5 20 Q40 -5 75 20 T145 20 T215 20 T275 20"/></svg>');

// Chips + grid
var cats=["All"].concat(ITEMS.map(function(i){return i.cat}).filter(function(v,i,a){return a.indexOf(v)===i}));
var icons={All:"✨",Toys:"🧸",Accessories:"🎀",Decor:"🌸"};
cats.forEach(function(c,i){
  var b=document.createElement("button"); b.className="chip"+(i?"":" on"); b.textContent=(icons[c]||"")+" "+c;
  b.onclick=function(){
    document.querySelectorAll(".chip").forEach(function(x){x.classList.remove("on")}); b.classList.add("on");
    document.querySelectorAll(".card").forEach(function(cd){
      var show=c==="All"||cd.dataset.cat===c; cd.classList.toggle("hide",!show);
      if(show){cd.classList.remove("in");void cd.offsetWidth;cd.classList.add("in")}
    });
  };
  $("#chips").appendChild(b);
});
function art(it){return it.img?'<img src="'+it.img+'" alt="'+it.n+'" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">':it.e}
ITEMS.forEach(function(it,idx){
  var cd=document.createElement("div"); cd.className="card"; cd.dataset.cat=it.cat;
  cd.style.setProperty("--c",it.c); cd.style.setProperty("--c2",it.c2);
  cd.innerHTML='<div class="tilt"><div class="inner"><div class="face front"><span class="tag">'+it.cat+'</span><span class="em">'+art(it)+'</span><b>'+it.n+'</b></div><div class="face back"><b>'+it.n+'</b><p>'+it.d+'</p><span class="btn alt">View closer 👀</span></div></div></div>';
  var tl=cd.querySelector(".tilt");
  cd.addEventListener("mousemove",function(e){
    var r=cd.getBoundingClientRect(), x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
    tl.style.transform="rotateX("+(-y*18)+"deg) rotateY("+(x*18)+"deg)";
  });
  cd.addEventListener("mouseleave",function(){tl.style.transform=""});
  cd.addEventListener("click",function(){open(it)});
  $("#grid").appendChild(cd);
});
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){
  var c=e.target; setTimeout(function(){c.classList.add("in")},(Array.prototype.indexOf.call(c.parentNode.children,c)%4)*90); io.unobserve(c)}})},{threshold:.1});
document.querySelectorAll(".card").forEach(function(c){io.observe(c)});

// Modal
function open(it){
  $("#mBig").innerHTML=art(it); $("#mBig").style.background="linear-gradient(145deg,"+it.c+","+it.c2+")";
  $("#mName").textContent=it.n; $("#mDesc").textContent=it.d;
  $("#mWa").href=waLink("Hi! I'm interested in the "+it.n+" from your crochet collection.");
  $("#modal").classList.add("open");
}
function shut(){$("#modal").classList.remove("open")}
$("#close").onclick=shut;
$("#modal").addEventListener("click",function(e){if(e.target.id==="modal")shut()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")shut()});
</script>
</body>
</html>
